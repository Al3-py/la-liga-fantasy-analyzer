<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaLiga Fantasy - Precios en Tiempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .auth-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .google-signin-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .google-signin-btn:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .user-info {
            background: #f0f7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .user-info.visible {
            display: block;
        }

        .logout-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }

        .logout-btn:hover {
            background: #ff5252;
        }

        .players-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .players-section h2 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #666;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .price {
            font-weight: 600;
            color: #667eea;
        }

        .error {
            background: #ffe0e0;
            color: #c92a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #d3f9d8;
            color: #2f9e44;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            max-width: 300px;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ LaLiga Fantasy</h1>
            <p>Monitor de precios en tiempo real - Conectado a la API oficial de LALIGA Fantasy</p>
        </div>

        <div class="auth-section">
            <div id="authContainer">
                <h2>Inicia sesión para ver los precios</h2>
                <button class="google-signin-btn" onclick="signInWithGoogle()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Entrar con Google
                </button>
            </div>

            <div id="userInfo" class="user-info">
                <div>
                    Sesión iniciada como: <strong id="userName"></strong>
                    <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
                </div>
            </div>
        </div>

        <div id="playersContainer" style="display: none;">
            <div class="players-section">
                <h2>📊 Jugadores y Precios</h2>

                <div class="stats" id="statsContainer"></div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Busca un jugador..." onkeyup="filterPlayers()">
                </div>

                <div id="loadingContainer" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Cargando jugadores...</p>
                </div>

                <div id="errorContainer"></div>

                <table id="playersTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Equipo</th>
                            <th>Posición</th>
                            <th>Precio</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="playersBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const API_URL = 'https://la-liga-fantasy-analyzerprime.vercel.app';
        let allPlayers = [];

        // Inicializar Google Sign-In
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: '990495765040-o744p3i6acb2mqhcl15qp6k05s9loqis.apps.googleusercontent.com',
                callback: handleCredentialResponse
            });
        };

        function signInWithGoogle() {
            google.accounts.id.renderButton(
                document.querySelector('.google-signin-btn'),
                { theme: 'outline', size: 'large' }
            );
            google.accounts.id.prompt();
        }

        function handleCredentialResponse(response) {
            console.log("Token:", response.credential);
            
            localStorage.setItem('googleToken', response.credential);
            
            const decoded = parseJwt(response.credential);
            document.getElementById('userName').textContent = decoded.name;
            document.getElementById('userInfo').classList.add('visible');
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('playersContainer').style.display = 'block';
            
            fetchPlayers(response.credential);
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        async function fetchPlayers(token) {
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const table = document.getElementById('playersTable');

            loadingContainer.style.display = 'block';
            errorContainer.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/api/proxy?path=/v1/competition/1/players`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json',
                        'x-lang': 'es'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayPlayers(data);
                
            } catch (error) {
                console.error('Error:', error);
                errorContainer.innerHTML = `<div class="error">⚠️ Error al cargar jugadores: ${error.message}</div>`;
            } finally {
                loadingContainer.style.display = 'none';
            }
        }

        function displayPlayers(data) {
            const table = document.getElementById('playersTable');
            const tbody = document.getElementById('playersBody');
            const statsContainer = document.getElementById('statsContainer');

            if (Array.isArray(data)) {
                allPlayers = data;
            } else if (data.data && Array.isArray(data.data)) {
                allPlayers = data.data;
            } else {
                allPlayers = [];
            }

            if (allPlayers.length === 0) {
                document.getElementById('errorContainer').innerHTML = '<div class="error">No se encontraron jugadores</div>';
                return;
            }

            displayStats(allPlayers);

            tbody.innerHTML = '';
            allPlayers.forEach(player => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${player.name || player.firstName || 'N/A'}</td>
                    <td>${player.team || player.teamName || 'N/A'}</td>
                    <td>${player.position || player.pos || 'N/A'}</td>
                    <td class="price">$${(player.price || player.marketValue || 0).toLocaleString()}</td>
                    <td>${player.points || player.totalPoints || 0}</td>
                `;
                tbody.appendChild(row);
            });

            table.style.display = 'table';
        }

        function displayStats(players) {
            const statsContainer = document.getElementById('statsContainer');
            
            const avgPrice = (players.reduce((sum, p) => sum + (p.price || p.marketValue || 0), 0) / players.length).toFixed(2);
            const maxPrice = Math.max(...players.map(p => p.price || p.marketValue || 0));
            const totalPlayers = players.length;

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalPlayers}</div>
                    <div class="stat-label">Jugadores Totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">$${parseFloat(avgPrice).toLocaleString()}</div>
                    <div class="stat-label">Precio Promedio</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">$${maxPrice.toLocaleString()}</div>
                    <div class="stat-label">Precio Máximo</div>
                </div>
            `;
        }

        function filterPlayers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('playersBody');
            const rows = tbody.querySelectorAll('tr');

            rows.forEach(row => {
                const playerName = row.textContent.toLowerCase();
                row.style.display = playerName.includes(searchTerm) ? '' : 'none';
            });
        }

        function logout() {
            localStorage.removeItem('googleToken');
            document.getElementById('userInfo').classList.remove('visible');
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('playersContainer').style.display = 'none';
        }
    </script>
</body>
  </html>
